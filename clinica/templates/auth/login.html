{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-2">Bem-vindo</h2>
                <p class="text-muted mb-0">Acesse o sistema da clínica</p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuário</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha</label>
                    {{ form.password }}
                    {{ form.password.errors }}
                </div>

                <div class="d-grid mt-4">
                    <button class="btn btn-primary py-2">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
